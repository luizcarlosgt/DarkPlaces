cl_particles_quake "1"
// Desativa a checagem de atualizacao do menu (enviava pacote para 64.22.107.122:27950)
set menu_updatecheck 0
// Nao usar lightgrid como textura 3D no shader: o caminho GLES2 compila GLSL ES
// 1.00, onde "sampler3D" e palavra reservada (shader_glsl.h). Sem isso o shader
// MODE_LIGHTGRID falha ("lightgrid diffuse ... failed"). A iluminacao continua via
// amostragem do lightgrid na CPU (Mod_Q3BSP_LightPoint).
set mod_q3bsp_lightgrid_texture 0
// Desativa shadowmapping: evita FBO incompleto ("Attachment has zero size")
// em alguns browsers/WebGL2 quando o atlas de sombras excede GL_MAX_TEXTURE_SIZE
set r_shadow_shadowmapping 0
// Safe resolution for WebGL init
vid_width 1280
vid_height 720
r_swapinterval 0
r_shadow_realtime_world 0
r_shadow_realtime_dlight 0
r_shadow_bouncegrid 0
r_shadows 0
r_shadow_usenormalmap 0
